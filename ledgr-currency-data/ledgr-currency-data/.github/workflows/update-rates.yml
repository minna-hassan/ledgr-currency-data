
name: Update LEDGR currency rates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exchange rates
        env:
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
        run: python scripts/fetch_rates.py

      - name: Validate exchange rates
        run: python scripts/validate_rates.py

      - name: Commit changed snapshot
        run: |
          git config user.name "LEDGR Rates Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/rates.json

          if git diff --cached --quiet; then
            echo "No rate-data change to commit."
            exit 0
          fi

          git commit -m "Update currency rates"
          git push
